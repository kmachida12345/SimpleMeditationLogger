name: Release to Play Console (internal)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # tag-on-version-bump.yml から呼ばれる（GITHUB_TOKEN で push したタグは push イベントを発火しないため）
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version_name=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)
          if [ "v${version_name}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match app.versionName=${version_name}" >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing key and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Publish AAB to internal track
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew publishReleaseBundle

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play-service-account.json"

  # リリース成功後、次のリリース用に versionCode+1 / patch+1 の PR を作る。
  # この PR をマージすると tag-on-version-bump.yml が次のリリースを実行する。
  bump-version-pr:
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/bump-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Skip if a bump PR is already open
        id: existing
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          echo "open=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create bump PR
        if: steps.existing.outputs.open == 'false'
        run: |
          ./bump-version.sh patch -y
          code=$(grep '^app.versionCode=' gradle.properties | cut -d= -f2)
          name=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "chore: bump version to ${name} (versionCode ${code})"
          git push --force origin "$BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore: bump version to ${name} (versionCode ${code})" \
            --body "$(cat <<BODY
          ${{ needs.publish.outputs.tag }} のリリース後に自動作成された次バージョンの PR です。

          - versionCode: ${code}
          - versionName: ${name}

          **この PR をマージすると \`v${name}\` タグが付き、Play Console の internal トラックへ自動アップロードされます。**
          次にリリースしたいタイミングまで開いたままにしてください。
          minor / major にしたい場合は \`gradle.properties\` の \`app.versionName\` をこのブランチ上で書き換えてからマージしてください。
          BODY
          )"
